<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="OpsPilot — DevOps, CI/CD and SRE on autopilot for businesses and startups.">
  <title>OpsPilot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2360a5fa'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M18 40 L32 16 L46 40 Z' fill='white' opacity='.9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/glass.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('op-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('op-glass') === 'solid') document.documentElement.dataset.glass = 'solid';
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- Liquid glass refraction filter. The displacement map (#lg-map) is regenerated by JS as an
       edge-weighted lens map; the turbulence fallback below is used until then. -->
  <svg class="sr-only" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="lg" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
        <feImage id="lg-map" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map" href=""/>
        <feDisplacementMap in="SourceGraphic" in2="map" scale="0.045" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="lg-noise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="backdrop" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="blob blob-d"></div>
    <div class="grain"></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" aria-busy="true">
    <div class="boot glass lens" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Starting OpsPilot…</span>
    </div>
  </div>
  <noscript><p class="noscript">OpsPilot needs JavaScript enabled.</p></noscript>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="alerts" class="sr-only" role="alert" aria-live="assertive"></div>
</body>
</html>
