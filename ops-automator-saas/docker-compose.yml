version: '3.8'

services:
  ops-automator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ops-automator-saas
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ops-network

networks:
  ops-network:
    driver: bridge

