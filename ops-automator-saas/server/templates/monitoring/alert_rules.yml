groups:
  - name: application.rules
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected on production cluster"
          description: "Error rate is {{ $value }} errors per second. Self-healing rollback triggered."

      - alert: HighResponseTimeP95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.25
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P95 response latency exceeded 250ms threshold"
          description: "95th percentile response time is {{ $value }} seconds"

      - alert: ClusterHighCpuUtilization
        expr: avg(cpu_utilization_percent) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Cluster CPU utilization above 80%"
          description: "Auto-scaling group scale-out triggered."

